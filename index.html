<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPTV Player Bangla</title><style>body{font-family:system-ui;margin:0;background:#0b1220;color:#fff}main{max-width:720px;margin:0 auto;padding:24px}video{width:100%;background:#000;border-radius:12px}input,button{padding:10px;border-radius:8px;border:1px solid #334155}input{width:70%;background:#0f172a;color:#fff}button{background:#0284c7;color:#fff;border:0}</style></head><body><main><h1>📺 IPTV Player Bangla</h1><p>Paste an M3U8 URL and press Play. Default: Free-TV/IPTV full playlist.</p><video id="v" controls playsinline></video><p><input id="u" value="https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8"><button onclick="play()">Play</button></p><p>Based on technomancer702/nodecast-tv (self-hosted player with EPG). This is a lightweight static starter — for full EPG/favourites, use the Node/Docker app.</p></main><script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script><script>function play(){const v=document.getElementById('v');const src=document.getElementById('u').value;if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=src;v.play()}else if(window.Hls&&Hls.isSupported()){const h=new Hls();h.loadSource(src);h.attachMedia(v);h.on(Hls.Events.MANIFEST_PARSED,()=>v.play())}}play()</script></body></html>
